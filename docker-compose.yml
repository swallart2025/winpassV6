services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: winpass
    # Le port 3000 est publié ICI car l'app partage le réseau de la base (voir plus bas).
    ports:
      - "5432:5432"
      - "3000:3000"
    # Volume nommé : les données PostgreSQL SURVIVENT aux redémarrages
    # (fermeture/réouverture du Codespace, docker compose up/down sans -v).
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 3s
      timeout: 3s
      retries: 20

  app:
    build: .
    # CORRECTIF RÉSEAU (Codespaces) : l'app PARTAGE le réseau de la base. Elle joint
    # donc PostgreSQL en 127.0.0.1 de façon garantie, sans dépendre du DNS entre
    # conteneurs (qui échoue dans certains Codespaces -> ancien blocage « Attente de
    # PostgreSQL »). Conséquence : les ports de l'app sont publiés sur le service `db`.
    network_mode: "service:db"
    environment:
      DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/winpass
      TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/winpass_test
      DB_HOST: 127.0.0.1
      RAILS_MAX_THREADS: "20"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
